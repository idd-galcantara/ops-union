name: Package desktop applications

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run security, dependency, and workspace gates
        run: npm run security:prepackage

  package-linux:
    name: Package Linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run package:linux

      - name: Inspect Linux package inputs
        run: node scripts/inspect-package.mjs

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-union-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Package Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run package:win

      - name: Inspect Windows package inputs
        run: node scripts/inspect-package.mjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-union-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package macOS
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG_DMG: 'true'

      - name: Inspect macOS package inputs
        run: node scripts/inspect-package.mjs

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-union-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-linux
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25.2.1
          cache: npm

      - name: Validate tag version
        shell: bash
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: ops-union-linux-${{ github.sha }}
          path: downloaded/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: ops-union-windows-${{ github.sha }}
          path: downloaded/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: ops-union-macos-${{ github.sha }}
          path: downloaded/macos

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          previous_tag="$(git tag --sort=-version:refname --merged "${GITHUB_SHA}^" | head -n 1 || true)"

          mkdir -p release-assets
          find downloaded -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name '*.zip' \
          \) -exec cp {} release-assets/ \;

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [[ "$asset_count" -ne 7 ]]; then
            echo "Expected 7 release assets, found $asset_count"
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi

          if [[ -n "$previous_tag" ]]; then
            changes="$(git log --pretty=format:'- %s (%h)' "$previous_tag..$GITHUB_SHA")"
          else
            changes="$(git log --pretty=format:'- %s (%h)' "$GITHUB_SHA")"
          fi

          cat > release-notes.md <<EOF
          # ops-union v$version

          ## Destaques

          - Instaladores para Linux, Windows e macOS.
          - macOS Intel (\`x64\`) e Apple Silicon (\`arm64\`).
          - Aplicacao read-only para workloads Kubernetes.

          ## Instalacao

          - **Ubuntu/Debian:** baixe o arquivo \`.deb\` e execute \`sudo apt install ./ops-union-$version-linux-amd64.deb\`.
          - **Linux geral:** baixe o \`.AppImage\`, execute \`chmod +x\` e abra o arquivo.
          - **Windows 64-bit:** execute o instalador \`.exe\`.
          - **macOS Apple Silicon:** use \`ops-union-$version-mac-arm64.dmg\` ou o ZIP \`arm64\`.
          - **macOS Intel:** use \`ops-union-$version-mac-x64.dmg\` ou o ZIP \`x64\`.

          ## Commits incluidos

          $changes

          ## Observacoes

          - Os instaladores podem nao possuir assinatura de codigo ou notarizacao.
          - O AppImage pode exigir o pacote FUSE da distribuicao Linux.
          - O kubeconfig e os executaveis de autenticacao \`exec\` devem existir na maquina do usuario.

          ## Arquivos

          Os instaladores para todas as plataformas estao anexados abaixo.
          EOF

          echo "Release assets:"
          ls -lh release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ops-union ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            release-assets/*
